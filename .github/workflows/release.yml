name: Release

# Push a tag like v1.0.0 → build the installer on Windows (same steps as
# build.ps1) → DRAFT GitHub release with the installer, its .sha256 and the
# matching CHANGELOG.md section. Publishing the draft stays a manual step.
#
# Two jobs on purpose: everything that runs third-party code (pip, npm,
# PyInstaller, Inno Setup) has a read-only token; the job that writes runs none
# of it and only hands the finished files to `gh release create`.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}     # only ever used through $env:TAG
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Tag must match noirpad/__version__.py
        shell: pwsh
        run: |
          $version = (python -c "from noirpad.__version__ import __version__; print(__version__)").Trim()
          if ($env:TAG -ne "v$version") {
            Write-Error "Tag '$env:TAG' does not match version '$version' in noirpad/__version__.py"
            exit 1
          }

      # build.ps1 smoke-tests dist\NoirPad before Inno Setup packs it and
      # fails the build if NoirPad.exe doesn't start (tools/smoke_test.ps1).
      - name: Build (build.ps1, incl. smoke test)
        shell: pwsh
        run: ./build.ps1 -Python python -RequirementsLock requirements-ci.lock

      - name: Smoke test the packed build again before upload
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          ./tools/smoke_test.ps1 -Exe dist/NoirPad/NoirPad.exe -Version $version

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## \[?$([regex]::Escape($version))\]?" | Select-Object -First 1).LineNumber
          if (-not $start) { Write-Error "CHANGELOG.md has no section for $version"; exit 1 }
          $notes = $lines[$start..($lines.Count - 1)] | ForEach-Object -Begin { $stop = $false } -Process {
            if ($_ -match "^## ") { $stop = $true }
            if (-not $stop) { $_ }
          }
          $notes | Set-Content dist/installer/release-notes.md -Encoding utf8

      # The same installer under a fixed name, so README's
      # releases/latest/download/NoirPad-Setup.exe always gets the newest one.
      - name: Installer copy under a stable name
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          Copy-Item "dist/installer/NoirPad-Setup-$version.exe" "dist/installer/NoirPad-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/installer/NoirPad-Setup.exe").Hash.ToLower()
          Set-Content "dist/installer/NoirPad-Setup.exe.sha256" "$hash  NoirPad-Setup.exe" -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist/installer/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}     # only ever used through $env:TAG
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart("v")
          gh release create "$env:TAG" `
            "release-files/NoirPad-Setup-$version.exe" `
            "release-files/NoirPad-Setup-$version.exe.sha256" `
            "release-files/NoirPad-Setup.exe" `
            "release-files/NoirPad-Setup.exe.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --draft --title "NoirPad $version" --notes-file release-files/release-notes.md
