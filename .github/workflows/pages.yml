# Website of NoirPad (site/, Astro) on GitHub Pages: https://arcly-studio.github.io/noirpad/ (same pattern as the
# Dirwise site). Repository settings → Pages → Source must be "GitHub Actions".
# Address and base path come from actions/configure-pages (fits <owner>.github.io/<repo>/ and a custom domain).
# On push it runs only with the repository variable PAGES_ENABLED=true (set it after turning Pages on, otherwise
# configure-pages fails); a manual run (workflow_dispatch) always works. The github-pages environment allows
# deployments only from the default branch (main), so the site is deployed from main.
# The app's own tests (test.yml) ignore site/**; nothing here builds or touches the app.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # Type check (astro check), then npm run build = prepare (fonts, favicons) + astro build + check-words.
      - run: npm run check:types
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
