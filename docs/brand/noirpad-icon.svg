<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="np-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171d19"/><stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <linearGradient id="np-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".38" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="np-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00a42a" stop-opacity=".55"/><stop offset=".55" stop-color="#00a42a" stop-opacity=".12"/><stop offset="1" stop-color="#00a42a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="np-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dff7a"/><stop offset=".45" stop-color="#0aff49"/><stop offset="1" stop-color="#17ad3d"/>
    </linearGradient>
    <linearGradient id="np-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="np-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="np-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3e6d8"/>
    </linearGradient>
    <filter id="np-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <filter id="np-frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="np-caret" x="-60%" y="-120%" width="220%" height="340%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="np-tileclip"><rect width="256" height="256" rx="58"/></clipPath>
    <clipPath id="np-frontclip"><rect x="60" y="50" width="120" height="152" rx="24"/></clipPath>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="58" fill="url(#np-tile)"/>
  <g clip-path="url(#np-tileclip)">
    <ellipse cx="128" cy="222" rx="150" ry="96" fill="url(#np-glow)"/>
  </g>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="url(#np-rim)" stroke-width="3"/>

  <!-- back sheet (blue) -->
  <rect x="80" y="56" width="114" height="144" rx="24" transform="rotate(9 137 128)" fill="url(#np-blue)" filter="url(#np-shadow)"/>

  <!-- front sheet (frosted glass) -->
  <g filter="url(#np-shadow)">
    <rect x="60" y="50" width="120" height="152" rx="24" fill="#0d150f"/>
  </g>
  <g clip-path="url(#np-frontclip)">
    <rect x="80" y="56" width="114" height="144" rx="24" transform="rotate(9 137 128)" fill="#00a42a" opacity=".26" filter="url(#np-frost)"/>
    <rect x="60" y="50" width="120" height="152" fill="url(#np-sheen)"/>
  </g>
  <rect x="61" y="51" width="118" height="150" rx="23" fill="none" stroke="url(#np-edge)" stroke-width="2"/>

  <!-- prompt >_ -->
  <path d="M88 104l25 23-25 23" fill="none" stroke="url(#np-white)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="122" y="141" width="36" height="13" rx="6.5" fill="#0aff49" opacity=".9" filter="url(#np-caret)"/>
  <rect x="122" y="141" width="36" height="13" rx="6.5" fill="#31ff66"/>
</svg>
